name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e . pytest pytest-asyncio pytest-socket ruff langchain-tests
      - run: ruff check .
      - run: ruff format --check .
      # Sockets disabled, so a green CI run cannot depend on the live API.
      - run: pytest tests/unit_tests -q --disable-socket
