[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "langchain-flexai"
description = "An integration package connecting FlexAI and LangChain"
license = { text = "MIT" }
readme = "README.md"
authors = [{ name = "FlexAI" }]
keywords = ["langchain", "flexai", "llm", "inference"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

version = "0.1.0"
requires-python = ">=3.10.0,<4.0.0"
dependencies = [
    "langchain-core>=1.4.7,<2.0.0",
    "langchain-openai>=1.3.1,<2.0.0",
]

[project.urls]
Homepage = "https://flex.ai"
Documentation = "https://docs.flex.ai/inference-api/agents/langchain"
Repository = "https://github.com/flexaihq/langchain-flexai"
Issues = "https://github.com/flexaihq/langchain-flexai/issues"

[dependency-groups]
test = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-socket>=0.7.0",
]
lint = ["ruff>=0.9.0"]

[tool.hatch.build.targets.wheel]
packages = ["langchain_flexai"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "D"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
